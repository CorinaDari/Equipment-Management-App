services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: farm_db
      POSTGRES_USER: farm_user
      POSTGRES_PASSWORD: farm_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farm_user -d farm_db"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Local development credentials only
      DB_URL: jdbc:postgresql://db:5432/farm_db
      DB_USERNAME: farm_user
      DB_PASSWORD: farm_pass
    ports:
      - "8080:8080"

volumes:
  pgdata: