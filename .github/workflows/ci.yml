name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '17'
          cache: maven

      - name: Build and run tests
        run: ./mvnw -B verify

  docker:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare env
        run: cp .env.example .env

      - name: Start stack and smoke test
        run: |
          docker compose up -d --build
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/v3/api-docs || true)
            if [ "$code" = "200" ]; then
              echo "App is up (HTTP $code)"
              exit 0
            fi
            sleep 3
          done
          echo "App did not start"
          docker compose logs springboot
          exit 1

      - name: Stop stack
        if: always()
        run: docker compose down -v